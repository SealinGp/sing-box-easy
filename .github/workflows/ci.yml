name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # Every release architecture must keep compiling — catches
      # platform-specific regressions (e.g. dependencies without arm support)
      # before a release run discovers them.
      - name: Cross-compile smoke
        run: |
          for arch in amd64 arm64 arm; do
            echo "== linux/$arch"
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch GOARM=7 \
              go build -trimpath -o /dev/null ./main.go
          done

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - name: Cache bun install store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Type-check and build
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build
