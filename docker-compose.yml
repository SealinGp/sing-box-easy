services:
  sing-box-easy:
    image: sealingp/sing-box-easy
    container_name: sing-box-easy
    ports:
      - "8001:8080"
    volumes:
      # Mount config directory
      - /etc/sing-box:/etc/sing-box
      # Mount app config
      - ./app.yml:/app/app.yml:ro
    environment:
      - HTTP_PORT=8080
    restart: unless-stopped
    networks:
      - sing-box-network

networks:
  sing-box-network:
    driver: bridge
