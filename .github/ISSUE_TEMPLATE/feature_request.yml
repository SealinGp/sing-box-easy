name: Feature request / 功能建议
description: Suggest something the panel should do. / 希望面板增加或改进的功能。
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do? / 你想解决什么问题？
      description: The situation you are in, not the solution. / 请描述遇到的场景，而不是解决方案。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see? / 你希望怎样实现？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds / 替代方案或目前的做法
